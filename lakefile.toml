name = "erdos112"
version = "0.1.0"
defaultTargets = ["Erdos112"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

# The pair-by-pair search code of Lemma 8 (no imports). In this folder it is not run inside
# a proof (no `native_decide`); it supplies the fixed pairs and the optional program `lemmab`.
[[lean_lib]]
name = "Erdos112Search"

[[lean_lib]]
name = "Erdos112"

# Stand-alone native runner of the two searches of Lemma 8.
[[lean_exe]]
name = "lemmab"
root = "LemmaBMain"
